services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: incidents
      POSTGRES_USER: incident
      POSTGRES_PASSWORD: incident
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident -d incidents"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:3.9.1
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list"]
      interval: 8s
      timeout: 5s
      retries: 20
  tenant-service:
    build: { context: ., args: { MODULE: tenant-service } }
    ports: ["8081:8081"]
  order-service:
    build: { context: ., args: { MODULE: order-service } }
    ports: ["8082:8082"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/incidents
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      TENANT_SERVICE_URL: http://tenant-service:8081
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
      tenant-service: { condition: service_started }
  payment-service:
    build: { context: ., args: { MODULE: payment-service } }
    ports: ["8083:8083"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/incidents
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
  notification-service:
    build: { context: ., args: { MODULE: notification-service } }
    ports: ["8084:8084"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/incidents
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
