[SERVICE]
    Flush         2
    Log_Level     info
    Parsers_File  parsers.conf

[INPUT]
    Name              tail
    Path              /logs/*.json
    Parser            json
    Tag               incident.*
    Refresh_Interval  2
    Read_from_Head    true

[OUTPUT]
    Name                opensearch
    Match               incident.*
    Host                opensearch
    Port                9200
    Index               incident-logs
    Suppress_Type_Name  On
    Logstash_Format     On
    Logstash_Prefix     incident-logs
    Retry_Limit         False
