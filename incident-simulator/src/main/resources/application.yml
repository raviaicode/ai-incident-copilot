server.port: 8090
spring.application.name: incident-simulator
incident:
  control.token: ${INCIDENT_SIMULATOR_TOKEN:local-simulator-token}
  targets:
    payment: ${PAYMENT_SERVICE_URL:http://localhost:8083}
    notification: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
management:
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
  metrics.tags.application: ${spring.application.name}
  tracing.sampling.probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp.tracing.endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
logging:
  file.name: ${LOG_FILE:logs/incident-simulator.json}
  structured.format:
    console: ecs
    file: ecs
